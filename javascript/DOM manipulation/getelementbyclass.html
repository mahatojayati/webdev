<body>
    <nav class="block">
        <p> this is a paragraph.</p>
    </nav>

    <div class="block">
        <h4> Hello, my name is <span id = "username">Liz</span></h4>
        <p class = "block" >Here is a code for you</p>
        <pre><code>console.log("Hello")</code></pre>
    </div>
<script>
    const element = document.getElementsByClassName("block")
    console.log(element);
    for(let i = 0; i<=element.length; i++)
{
    element.item(i).style.background = "lightblue"
    
}
</script>
