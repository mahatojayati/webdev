<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YouTube Landing Page</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <!-- Hero Banner -->

        <section class="hero">

            <img src="images/banner.jpg" alt="Banner">

        </section>

        <!-- Videos -->

        <section class="videos">

            <!-- Card 1 -->

            <div class="card">

                <div class="thumbnail">

                    <img src="images/paris.jpg" alt="Paris">

                </div>

                <div class="content">

                    <h3>48 Hours Alone in Paris</h3>

                    <p>Cafés • Bookstores • Solo Travel</p>

                    <a href="#" class="btn">Watch Now</a>

                </div>

            </div>

            <!-- Card 2 -->

            <div class="card">

                <div class="thumbnail">

                    <img src="images/week-life.jpg" alt="Week In My Life">

                </div>

                <div class="content">

                    <h3>A Week in My Life</h3>

                    <p>Student Vlog • Hong Kong</p>

                    <a href="#" class="btn">Watch Now</a>

                </div>

            </div>

            <!-- Card 3 -->

            <div class="card">

                <div class="thumbnail">

                    <img src="images/digital-diaries.jpg" alt="Digital Diaries">

                </div>

                <div class="content">

                    <h3>Digital Diaries</h3>

                    <p>Photography • Lifestyle</p>

                    <a href="#" class="btn">Watch Now</a>

                </div>

            </div>

            <!-- Card 4 -->

            <div class="card">

                <div class="thumbnail">

                    <img src="images/weekend-city.jpg" alt="Weekend">

                </div>

                <div class="content">

                    <h3>A Weekend in the City</h3>

                    <p>Farmers Market • Cafés</p>

                    <a href="#" class="btn">Watch Now</a>

                </div>

            </div>

        </section>

        <!-- Footer -->

        <footer>

            © 2026 Jayati Mahato. All rights reserved.

        </footer>

    </div>

</body>

</html>
